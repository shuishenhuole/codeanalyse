name: Release

# 推送形如 v0.1.0 / v0.2.0-beta.1 的 tag 时触发
on:
  push:
    tags:
      - "v*"
  # 也可以在 Actions 页面手动重跑某个 tag 的打包
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: codeanalyse

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # eframe(glow) 在 Linux 上需要 gtk / xkbcommon / xcb 等系统库
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" "$dist/CodeStat.exe"
          Copy-Item LICENSE "$dist/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$dist/*" -DestinationPath "CodeStat-${{ github.ref_name }}-${{ matrix.suffix }}.zip"
          Get-ChildItem "CodeStat-*.zip" | ForEach-Object { Write-Host $_.Name $_.Length }

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="CodeStat-${{ github.ref_name }}-${{ matrix.suffix }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$stage/"
          cp LICENSE "$stage/" 2>/dev/null || true
          tar -czf "${stage}.tar.gz" "$stage"
          ls -lh "${stage}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeStat-${{ matrix.suffix }}
          path: |
            CodeStat-*.zip
            CodeStat-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 只做提醒，不阻断发布：避免 tag 与 Cargo.toml 版本不一致
      - name: Warn if tag mismatches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$GITHUB_REF_NAME  cargo=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::warning::tag $GITHUB_REF_NAME 与 Cargo.toml 版本 $ver 不一致"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: CodeStat ${{ github.ref_name }}
          # 自动根据 commit / PR 生成发布说明
          generate_release_notes: true
          # tag 里带 - 的（如 v0.2.0-beta.1）自动标记为预发布
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/CodeStat-*.zip
            artifacts/CodeStat-*.tar.gz
